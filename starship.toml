"$schema" = 'https://starship.rs/config-schema.json'
command_timeout = 1000

palette = "warm_burnout_dark"

format="""
$directory\
$git_branch\
$python\
$nodejs\
$rust\
$cmd_duration
$character
"""

[cmd_duration]
format = "[❯](red)[❯](yellow)[❯](green) [$duration]($style) "
style = "bright-black"

[directory]
read_only = " "
style = "bold bright-yellow"

[docker_context]
symbol = " "

[git_branch]
symbol = " "
format = "[${symbol}$branch]($style) "
style = "green"

[golang]
symbol = " "

[nix_shell]
symbol = " "

[nodejs]
# symbol = " "
format = "[$symbol]($style) "

[package]
symbol = " "

[python]
symbol = ""
format = "[${symbol}$virtualenv]($style) "
style = "bright-black"

[ruby]
symbol = " "

[rust]
symbol = " "
format = "[$symbol](style) "

